name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '24'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded whole finite replay from the artifact repository root
        shell: bash
        run: |
          mkdir -p .scientific-output
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail <<'RUN' 2>&1 | tee .scientific-output/console.txt
          ulimit -v 2097152
          ulimit -S -t 110
          ulimit -H -t 115
          python -B .github/scripts/check_repository.py
          python -B tests/regression_prefix_intervals.py -v
          python -B reproduce.py --output .scientific-output/linear
          python -B reproduce_pinned.py --output .scientific-output/pinned
          python -B -m unittest discover -s tests -v
          python -B make_cases.py --output .scientific-output/generated-traces.json
          python -B make_pinned_cases.py --output .scientific-output/generated-pinned.json
          python -B make_budget_cases.py --output .scientific-output/generated-budgets.json
          python -B .github/scripts/check_scientific_outputs.py .scientific-output
          RUN
      - name: Preserve raw output on success, failure, or timeout
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finite-scientific-output
          path: .scientific-output/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
